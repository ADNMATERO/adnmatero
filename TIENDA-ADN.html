<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ADN Matero — Tienda</title>
<style>
:root{
  --verde:#2D6A4F;--verde2:#40916C;--verde3:#74C69D;
  --crema:#F8F3E8;--naranja:#E76F51;--gris:#264653;--gris2:#3A5A6A;
  --sombra:rgba(38,70,83,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f0ece1;font-family:'Segoe UI',system-ui,sans-serif;color:var(--gris);min-height:100vh;}

/* HEADER */
.header{background:var(--gris);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-logo{display:flex;align-items:center;gap:10px;}
.header-logo img{width:38px;height:38px;border-radius:50%;object-fit:cover;}
.header-title{font-size:18px;font-weight:700;color:var(--crema);letter-spacing:.5px;}
.header-sub{font-size:10px;color:var(--verde3);margin-top:-1px;}
.carrito-btn{background:var(--verde);border:none;border-radius:10px;padding:8px 12px;color:white;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;position:relative;}
.carrito-count{background:var(--naranja);color:white;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}

/* BANNER */
.banner{background:linear-gradient(135deg,var(--gris) 0%,var(--verde) 100%);padding:24px 16px;text-align:center;color:white;}
.banner h1{font-size:22px;font-weight:700;margin-bottom:4px;}
.banner p{font-size:13px;opacity:.8;}

/* CATS */
.cats{display:flex;gap:8px;padding:14px 16px;overflow-x:auto;scrollbar-width:none;background:white;border-bottom:1px solid rgba(38,70,83,.1);}
.cats::-webkit-scrollbar{display:none;}
.cat-btn{flex:0 0 auto;padding:6px 14px;border-radius:20px;border:1.5px solid rgba(38,70,83,.2);background:white;font-size:12px;font-weight:600;color:var(--gris2);cursor:pointer;white-space:nowrap;transition:all .2s;}
.cat-btn.active{background:var(--verde);color:white;border-color:var(--verde);}

/* BUSCAR */
.search-bar{padding:10px 16px;background:white;border-bottom:1px solid rgba(38,70,83,.08);}
.search-bar input{width:100%;padding:9px 14px 9px 36px;border:1.5px solid rgba(38,70,83,.18);border-radius:10px;font-size:13px;background:var(--crema);outline:none;}
.search-bar{position:relative;}
.search-icon{position:absolute;left:26px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.4;}

/* GRID PRODUCTOS */
.productos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 12px;}
@media(min-width:500px){.productos-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:700px){.productos-grid{grid-template-columns:repeat(4,1fr);}}

/* CARD PRODUCTO */
.prod-card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px var(--sombra);cursor:pointer;transition:transform .2s;}
.prod-card:hover{transform:translateY(-2px);}
.prod-img{width:100%;aspect-ratio:1;object-fit:cover;background:#e8e4da;display:flex;align-items:center;justify-content:center;font-size:36px;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-img.sin-foto{background:linear-gradient(135deg,#e8e4da,#d4cfc4);}
.prod-info{padding:10px;}
.prod-cod{font-size:9px;color:var(--gris2);opacity:.5;font-weight:600;margin-bottom:2px;}
.prod-nombre{font-size:12px;font-weight:700;color:var(--gris);line-height:1.3;margin-bottom:4px;}
.prod-precio{font-size:15px;font-weight:700;color:var(--verde);margin-bottom:8px;}
.prod-add{width:100%;padding:7px;background:var(--verde);color:white;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s;}
.prod-add:hover{background:var(--verde2);}
.prod-add.agregado{background:var(--naranja);}

/* EMPTY */
.empty{text-align:center;padding:48px 24px;color:rgba(38,70,83,.4);}
.empty .emoji{font-size:48px;display:block;margin-bottom:12px;}

/* MODAL PRODUCTO */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:white;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding-bottom:32px;}
.modal-img{width:100%;aspect-ratio:1;object-fit:cover;background:#e8e4da;max-height:280px;}
.modal-img.sin-foto{display:flex;align-items:center;justify-content:center;font-size:64px;}
.modal-body{padding:20px;}
.modal-cod{font-size:10px;color:var(--gris2);opacity:.5;font-weight:600;}
.modal-nombre{font-size:20px;font-weight:700;color:var(--gris);margin:4px 0 6px;}
.modal-desc{font-size:13px;color:var(--gris2);line-height:1.5;margin-bottom:16px;opacity:.8;}
.modal-precio{font-size:28px;font-weight:700;color:var(--verde);margin-bottom:20px;}
.qty-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.qty-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--verde);background:white;color:var(--verde);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-val{font-size:20px;font-weight:700;min-width:32px;text-align:center;}
.btn-agregar{width:100%;padding:14px;background:var(--verde);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;}
.modal-close{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.4);color:white;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* CARRITO DRAWER */
.carrito-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.carrito-sheet{background:white;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;}
.carrito-header{padding:16px 20px;border-bottom:1px solid rgba(38,70,83,.1);display:flex;justify-content:space-between;align-items:center;}
.carrito-header h3{font-size:18px;font-weight:700;}
.carrito-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gris);}
.carrito-items{flex:1;overflow-y:auto;padding:12px 16px;}
.carrito-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(38,70,83,.08);}
.ci-img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#e8e4da;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ci-img img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.ci-info{flex:1;min-width:0;}
.ci-nombre{font-size:12px;font-weight:600;color:var(--gris);}
.ci-precio{font-size:11px;color:var(--verde2);}
.ci-qty{display:flex;align-items:center;gap:6px;}
.ci-qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--verde);background:white;color:var(--verde);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ci-qty-val{font-size:13px;font-weight:700;min-width:20px;text-align:center;}
.ci-delete{background:none;border:none;font-size:16px;cursor:pointer;color:var(--naranja);}
.carrito-footer{padding:16px 20px;border-top:1px solid rgba(38,70,83,.1);}
.carrito-total{display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-bottom:8px;}
.carrito-total-val{color:var(--verde);font-size:20px;}

/* FORM PEDIDO */
.form-pedido{padding:0 20px 12px;}
.form-pedido label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gris2);display:block;margin-bottom:3px;margin-top:10px;}
.form-pedido input,.form-pedido textarea{width:100%;padding:9px 12px;border:1.5px solid rgba(38,70,83,.18);border-radius:8px;font-size:13px;font-family:inherit;outline:none;}
.form-pedido textarea{resize:vertical;min-height:60px;}

.btn-wsp{width:100%;padding:15px;background:#25D366;color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;}
.btn-wsp:disabled{opacity:.5;cursor:default;}
.carrito-empty{text-align:center;padding:32px;color:rgba(38,70,83,.4);}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gris);color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;transition:transform .3s;z-index:999;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}

/* FOTO UPLOAD en modal admin */
.foto-upload-area{border:2px dashed rgba(38,70,83,.25);border-radius:10px;padding:20px;text-align:center;cursor:pointer;margin-bottom:10px;color:var(--gris2);font-size:13px;}
.foto-upload-area:hover{border-color:var(--verde);background:rgba(45,106,79,.04);}
</style>
</head>

<script>
const SUPA_URL = 'https://qouleqetwdwyczrtibev.supabase.co';
const SUPA_KEY = 'sb_publishable_TA6ZmRh_xyv5ImRkCoSXzg_CGj5ThR5';
const WA_NUMBER = '5493534099163';

async function sbGet(table, query=''){
  const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${query}`,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  });
  return r.ok ? r.json() : [];
}

// ── ESTADO ──────────────────────────────────────────────────
let catalogo = [];
let fotos = {};
let carrito = [];
let catActiva = '';
let prodActual = null;

// ── INIT ────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  await cargarCatalogo();
});

async function cargarCatalogo(){
  document.getElementById('productosGrid').innerHTML = '<div style="grid-column:span 2;text-align:center;padding:40px;color:rgba(38,70,83,.4)">Cargando productos...</div>';
  const [prods, fotosList] = await Promise.all([
    sbGet('catalogo','activo=eq.true&order=categoria.asc,orden.asc,nombre.asc'),
    sbGet('catalogo_fotos','order=producto_id.asc,orden.asc')
  ]);
  catalogo = prods;
  // Agrupar fotos por producto
  fotos = {};
  fotosList.forEach(f=>{
    if(!fotos[f.producto_id]) fotos[f.producto_id] = [];
    fotos[f.producto_id].push(f.url);
  });
  renderProductos();
}

// ── RENDER ──────────────────────────────────────────────────
function filtrarCat(cat, el){
  catActiva = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderProductos();
}

function normalizar(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function formatPeso(n){ return '$'+Math.round(n).toLocaleString('es-AR'); }

function renderProductos(){
  const q = normalizar(document.getElementById('searchInput').value);
  let lista = catalogo;
  if(catActiva) lista = lista.filter(p=>p.categoria===catActiva);
  if(q) lista = lista.filter(p=>normalizar(p.nombre).includes(q)||normalizar(p.descripcion||'').includes(q)||String(p.codigo||'').includes(q));

  const grid = document.getElementById('productosGrid');
  const empty = document.getElementById('emptyState');

  if(!lista.length){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = lista.map(p=>{
    const foto = fotos[p.id]?.[0];
    const enCarrito = carrito.find(c=>c.id===p.id);
    return `<div class="prod-card" onclick="abrirProducto('${p.id}')">
      <div class="prod-img ${foto?'':'sin-foto'}">${foto?`<img src="${foto}" alt="${p.nombre}" loading="lazy">`:'🌿'}</div>
      <div class="prod-info">
        ${p.codigo?`<div class="prod-cod">#${p.codigo}</div>`:''}
        <div class="prod-nombre">${p.nombre}</div>
        <div class="prod-precio">${formatPeso(p.precio)}</div>
        <button class="prod-add ${enCarrito?'agregado':''}" onclick="event.stopPropagation();agregarRapido('${p.id}')">
          ${enCarrito?`🛒 ${enCarrito.qty} en carrito`:'+ Agregar'}
        </button>
      </div>
    </div>`;
  }).join('');
}

// ── MODAL PRODUCTO ──────────────────────────────────────────
function abrirProducto(id){
  prodActual = catalogo.find(p=>p.id===id);
  if(!prodActual) return;
  const foto = fotos[id]?.[0];
  const imgEl = document.getElementById('modalImg');
  if(foto){
    imgEl.innerHTML = `<img src="${foto}" alt="${prodActual.nombre}" style="width:100%;height:100%;object-fit:cover">`;
    imgEl.className = 'modal-img';
  } else {
    imgEl.innerHTML = '🌿';
    imgEl.className = 'modal-img sin-foto';
  }
  document.getElementById('modalCod').textContent = prodActual.codigo ? `#${prodActual.codigo}` : '';
  document.getElementById('modalNombre').textContent = prodActual.nombre;
  document.getElementById('modalDesc').textContent = prodActual.descripcion || '';
  document.getElementById('modalPrecio').textContent = formatPeso(prodActual.precio);
  document.getElementById('modalQty').textContent = '1';
  document.getElementById('modalProducto').style.display = 'flex';
}

function cambiarQty(dir){
  const el = document.getElementById('modalQty');
  const v = Math.max(1, parseInt(el.textContent)+dir);
  el.textContent = v;
}

function agregarAlCarrito(){
  if(!prodActual) return;
  const qty = parseInt(document.getElementById('modalQty').textContent);
  addToCart(prodActual, qty);
  document.getElementById('modalProducto').style.display = 'none';
  toast(`✅ ${prodActual.nombre} agregado al carrito`);
}

function agregarRapido(id){
  const prod = catalogo.find(p=>p.id===id);
  if(!prod) return;
  addToCart(prod, 1);
  toast(`✅ ${prod.nombre} agregado`);
}

function addToCart(prod, qty){
  const ex = carrito.find(c=>c.id===prod.id);
  if(ex) ex.qty += qty;
  else carrito.push({id:prod.id, nombre:prod.nombre, precio:prod.precio, qty, codigo:prod.codigo});
  actualizarCarritoUI();
  renderProductos();
}

// ── CARRITO ─────────────────────────────────────────────────
function abrirCarrito(){ document.getElementById('carritoDrawer').style.display='flex'; renderCarrito(); }

function renderCarrito(){
  const items = document.getElementById('carritoItems');
  if(!carrito.length){
    items.innerHTML = '<div class="carrito-empty"><span style="font-size:36px;display:block;margin-bottom:8px">🛒</span>El carrito está vacío</div>';
    document.getElementById('carritoTotal').textContent = '$0';
    return;
  }
  items.innerHTML = carrito.map(c=>{
    const foto = fotos[c.id]?.[0];
    return `<div class="carrito-item">
      <div class="ci-img">${foto?`<img src="${foto}" alt="${c.nombre}">`:'🌿'}</div>
      <div class="ci-info">
        <div class="ci-nombre">${c.nombre}</div>
        <div class="ci-precio">${formatPeso(c.precio)} c/u · <strong>${formatPeso(c.precio*c.qty)}</strong></div>
      </div>
      <div class="ci-qty">
        <button class="ci-qty-btn" onclick="cambiarQtyCarrito('${c.id}',-1)">−</button>
        <span class="ci-qty-val">${c.qty}</span>
        <button class="ci-qty-btn" onclick="cambiarQtyCarrito('${c.id}',1)">+</button>
      </div>
      <button class="ci-delete" onclick="quitarDelCarrito('${c.id}')">🗑</button>
    </div>`;
  }).join('');
  const total = carrito.reduce((s,c)=>s+c.precio*c.qty,0);
  document.getElementById('carritoTotal').textContent = formatPeso(total);
}

function cambiarQtyCarrito(id, dir){
  const item = carrito.find(c=>c.id===id);
  if(!item) return;
  item.qty += dir;
  if(item.qty <= 0) carrito = carrito.filter(c=>c.id!==id);
  actualizarCarritoUI(); renderCarrito(); renderProductos();
}

function quitarDelCarrito(id){
  carrito = carrito.filter(c=>c.id!==id);
  actualizarCarritoUI(); renderCarrito(); renderProductos();
}

function actualizarCarritoUI(){
  const total = carrito.reduce((s,c)=>s+c.qty,0);
  document.getElementById('carritoCount').textContent = total;
}

// ── WHATSAPP ────────────────────────────────────────────────
function enviarWhatsApp(){
  const nombre = document.getElementById('clienteNombre').value.trim();
  const tel    = document.getElementById('clienteTel').value.trim();
  const notas  = document.getElementById('clienteNotas').value.trim();

  if(!nombre){ toast('⚠️ Escribí tu nombre'); return; }
  if(!carrito.length){ toast('⚠️ El carrito está vacío'); return; }

  const total = carrito.reduce((s,c)=>s+c.precio*c.qty,0);
  const items = carrito.map(c=>`• ${c.nombre} x${c.qty} = ${formatPeso(c.precio*c.qty)}`).join('\n');

  let msg = `🌿 *NUEVO PEDIDO — ADN MATERO*\n\n`;
  msg += `👤 *Cliente:* ${nombre}\n`;
  if(tel) msg += `📱 *Teléfono:* ${tel}\n`;
  msg += `\n📦 *Detalle del pedido:*\n${items}\n`;
  msg += `\n💰 *Total estimado: ${formatPeso(total)}*\n`;
  if(notas) msg += `\n📝 *Notas:* ${notas}\n`;
  msg += `\n_Pedido enviado desde la tienda online de ADN Matero_`;

  const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

// ── HELPERS ─────────────────────────────────────────────────
function cerrarModalSiOverlay(e, id){
  if(e.target.id===id) document.getElementById(id).style.display='none';
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
</script>
